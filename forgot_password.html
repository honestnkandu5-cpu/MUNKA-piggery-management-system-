
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNKA PIGGERY - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #063d29, #087f4b, #075e9b);
            color: #17231c;
        }

        .container {
            width: 100%;
            max-width: 470px;
            padding: 32px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #075e3b;
            font-size: 29px;
            font-weight: 900;
        }

        h2 {
            margin: 12px 0 20px;
            text-align: center;
            color: #0d6efd;
            font-size: 23px;
        }

        p {
            line-height: 1.6;
            color: #59675e;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 52px;
            padding: 0 13px;
            border: 1px solid #cbd9d0;
            border-radius: 9px;
            background: #f9fcfa;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #087f4b;
            border-color: #087f4b;
        }

        .turnstile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            margin: 20px 0 12px;
            overflow: hidden;
        }

        button {
            display: block;
            width: 100%;
            min-height: 54px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(100deg, #075e3b, #087f4b, #0d6efd);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            min-height: 22px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #message.success {
            color: #087f4b;
        }

        #message.error {
            color: #c62828;
        }

        #message.info {
            color: #075e9b;
        }

        .back {
            margin-top: 22px;
            text-align: center;
        }

        .back a {
            color: #075e3b;
            font-weight: bold;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>MUNKA PIGGERY</h1>
        <h2>Forgot Password?</h2>

        <p>
            Enter the email address associated with your account.
            Complete the security verification and request a
            password reset link.
        </p>

        <form id="forgotPasswordForm">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <div class="turnstile-container">
                <div id="turnstileWidget"></div>
            </div>

            <button type="submit" id="resetButton" disabled>
                Loading Security Verification...
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="back">
            <a href="login.html">← Back to Login</a>
        </div>
    </main>

    <!-- Cloudflare Turnstile: explicit rendering -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
        async
        defer
    ></script>

    <!-- Existing project configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="forgot_password.js"></script>
</body>
</html>
