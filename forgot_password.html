
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNKA PIGGERY - Forgot Password</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            box-sizing: border-box;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #14532d;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            overflow: hidden;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #14532d;
            text-decoration: none;
        }

        @media (max-width: 360px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MUNKA PIGGERY</h1>
        <h2>Forgot Password</h2>

        <p>
            Enter the email address associated with your account.
            Complete the security verification to request a password
            reset link.
        </p>

        <form id="forgotPasswordForm">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <div class="captcha-container">
                <div
                    class="cf-turnstile"
                    data-sitekey="YOUR_TURNSTILE_SITE_KEY"
                    data-callback="onTurnstileSuccess"
                    data-expired-callback="onTurnstileExpired"
                    data-error-callback="onTurnstileError"
                    data-theme="light">
                </div>
            </div>

            <button type="submit" id="resetButton">
                Send Reset Link
            </button>
        </form>

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <div class="back">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        window.munkaTurnstileToken = "";

        window.onTurnstileSuccess = function(token) {
            window.munkaTurnstileToken = token;
        };

        window.onTurnstileExpired = function() {
            window.munkaTurnstileToken = "";
        };

        window.onTurnstileError = function() {
            window.munkaTurnstileToken = "";
            const message = document.getElementById("message");

            if (message) {
                message.textContent =
                    "Security verification failed. Please refresh and try again.";
            }
        };
    </script>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="forgot_password.js"></script>
</body>
</html>
