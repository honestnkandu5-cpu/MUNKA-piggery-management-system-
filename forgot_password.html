<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MUNKA PIGGERY - Forgot Password</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

.container{
    width:90%;
    max-width:450px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#14532d;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#198754;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#146c43;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#14532d;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

    <h1>MUNKA PIGGERY</h1>

    <h2>Forgot Password</h2>

    <p>
        Enter the email address associated with your account.
        We will send you a password reset link.
    </p>

    <form id="forgotPasswordForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div
        id="message"
        class="message">
    </div>

    <div class="back">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="forgot_password.js"></script>

</body>

</html>
