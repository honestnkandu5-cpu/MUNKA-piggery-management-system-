<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUNKA Piggery - Weaning Records</title>

<link rel="stylesheet" href="weaning.css">

</head>

<body>

<div class="container">

<h1>🐖 MUNKA PIGGERY FARM</h1>

<h2>Weaning Records</h2>

<!-- ===========================
SEARCH
=========================== -->

<div class="searchBox">

<input
type="text"
id="searchWeaning"
placeholder="Search by Sow ID">

</div>

<!-- ===========================
WEANING FORM
=========================== -->

<form id="weaningForm">

<div class="form-group">

<label>Sow ID</label>

<input
type="text"
id="sowID"
placeholder="Enter Sow ID"
required>

<button
type="button"
onclick="loadFarrowingSow()">
🔍 Search Sow ID
</button>

</div>


<div class="form-group">

<label>Farrow Date</label>

<input
type="date"
id="farrowDate"
required>

</div>


<div class="form-group">

<label>Weaning Date</label>

<input
type="date"
id="weaningDate"
readonly>

</div>


<div class="form-group">

<label>Total Born</label>

<input
type="number"
id="totalBorn"
min="0">

</div>


<div class="form-group">

<label>Male Weaned</label>

<input
type="number"
id="maleWeaned"
min="0"
value="0">

</div>


<div class="form-group">

<label>Female Weaned</label>

<input
type="number"
id="femaleWeaned"
min="0"
value="0">

</div>


<div class="form-group">

<label>Total Weaned</label>

<input
type="number"
id="totalWeaned"
readonly>

</div>


<div class="form-group">

<label>Average Weight (Kg)</label>

<input
type="number"
step="0.01"
id="averageWeight">

</div>


<div class="form-group">

<label>Mortality</label>

<input
type="number"
id="mortality"
min="0"
value="0">

</div>


<div class="form-group">

<label>Mortality Reason</label>

<select id="mortalityReason">

<option value="">Select</option>

<option>Crushing by Sow</option>

<option>Starvation</option>

<option>Scours (Diarrhoea)</option>

<option>Pneumonia</option>

<option>Weak Piglet</option>

<option>Congenital Defect</option>

<option>Injury</option>

<option>Unknown Cause</option>

<option>Other</option>

</select>

</div>


<div
class="form-group"
id="otherReasonGroup"
style="display:none;">

<label>Other Reason</label>

<input
type="text"
id="otherReason">

</div>


<div class="form-group">

<label>Destination Pen</label>

<select id="destinationPen">

<option value="">Select Pen</option>

<option>Nursery Pen 1</option>

<option>Nursery Pen 2</option>

<option>Nursery Pen 3</option>

<option>Grower Pen 1</option>

<option>Grower Pen 2</option>

<option>Isolation Pen</option>

<option>Other</option>

</select>

</div>


<div class="form-group">

<label>Remarks</label>

<textarea
id="remarks"
rows="4"></textarea>

</div>

<!-- ===========================
BUTTONS
=========================== -->

<div class="buttons">

<button type="submit">
💾 Save Record
</button>

<button
type="button"
onclick="clearForm()">
🧹 Clear
</button>

<button
type="button"
onclick="generateReport()">
📊 Report
</button>

<button
type="button"
onclick="printReport()">
🖨 Print
</button>

</div>

</form>

<hr>

<!-- ===========================
TABLE
=========================== -->

<table>

<thead>

<tr>

<th>Sow ID</th>

<th>Farrow Date</th>

<th>Weaning Date</th>

<th>Total Born</th>

<th>Total Weaned</th>

<th>Average Weight</th>

<th>Destination Pen</th>

<th>Action</th>

</tr>

</thead>

<tbody id="weaningTable">

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="supabase.js"></script>

<script src="activity.js"></script>
<script src="security.js"></script>
<script src="weaning.js"></script>

</body>

</html>
