<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registered Farm - Sales Records</title>

    <link rel="stylesheet" href="sales.css">

    <link rel="stylesheet" href="farm_branding.css">

    <!-- ==================================================
         jsPDF
    ================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

</head>


<body>


<div class="container">

    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <div class="page-header">

        <div>

            <div class="software-brand">
                🐖 MUNKA PIGGERY TECHNOLOGY
            </div>

            <p class="subtitle">
                Piggery Management System
            </p>

            <div class="farm-branding">

                <span class="farm-label">
                    REGISTERED FARM
                </span>

                <strong data-farm-name>
                    Loading farm...
                </strong>

            </div>

        </div>

        <div class="module-badge">
            SALES RECORDS
        </div>

    </div>


    <!-- ==================================================
         SALES FORM
    ================================================== -->

    <form id="salesForm">


        <div class="form-grid">


            <!-- RECORD ID -->

            <div class="form-group">

                <label for="recordID">
                    Record ID
                </label>

                <input
                    type="text"
                    id="recordID"
                    readonly
                    placeholder="Automatically generated">

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label for="saleDate">
                    Date of Sale
                </label>

                <input
                    type="date"
                    id="saleDate"
                    required>

            </div>


            <!-- PIG ID -->

            <div class="form-group">

                <label for="pigID">
                    Pig ID
                </label>

                <input
                    type="text"
                    id="pigID"
                    required
                    placeholder="Enter Pig ID">

            </div>


            <!-- BREED -->

            <div class="form-group">

                <label for="breed">
                    Breed
                </label>

                <select id="breed" required>

                    <option value="">
                        Select Breed
                    </option>

                    <option>Large White</option>
                    <option>Landrace</option>
                    <option>Large White × Landrace Cross</option>
                    <option>Duroc</option>
                    <option>Pietrain</option>
                    <option>Hampshire</option>
                    <option>Berkshire</option>
                    <option>Yorkshire</option>
                    <option>Tamworth</option>
                    <option>Chester White</option>
                    <option>Poland China</option>
                    <option>Meishan</option>
                    <option>Cross Breed</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option>Piglet</option>
                    <option>Weaner</option>
                    <option>Grower</option>
                    <option>Finisher</option>
                    <option>Sow</option>
                    <option>Boar</option>

                </select>

            </div>


            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <select id="quantity" required>

                    <option value="">
                        Select Quantity
                    </option>

                </select>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <select id="weight" required>

                    <option value="">
                        Select Weight
                    </option>

                </select>

            </div>


            <!-- PRICE PER KG -->

            <div class="form-group">

                <label for="pricePerKg">
                    Price Per Kg (ZMW)
                </label>

                <select id="pricePerKg" required>

                    <option value="">
                        Select Price
                    </option>

                </select>

            </div>


            <!-- TOTAL -->

            <div class="form-group">

                <label for="totalAmount">
                    Total Amount (ZMW)
                </label>

                <input
                    type="number"
                    id="totalAmount"
                    readonly
                    placeholder="Automatically calculated">

            </div>


            <!-- BUYER NAME -->

            <div class="form-group">

                <label for="buyerName">
                    Buyer Name / Company
                </label>

                <select id="buyerCategory">

                    <option value="">
                        Select Buyer Type
                    </option>

                    <option>Local Farmer</option>
                    <option>Butcher</option>
                    <option>Meat Trader</option>
                    <option>Pork Processor</option>
                    <option>Restaurant</option>
                    <option>Hotel</option>
                    <option>Individual Buyer</option>
                    <option>Wholesaler</option>
                    <option>Retailer</option>
                    <option>Supermarket</option>
                    <option>Farm Business</option>
                    <option>Other</option>

                </select>

                <input
                    type="text"
                    id="buyerName"
                    placeholder="Enter actual person's name or company name"
                    style="margin-top: 8px;">

            </div>


            <!-- BUYER CONTACT -->

            <div class="form-group">

                <label for="buyerContact">
                    Buyer Contact
                </label>

                <select id="buyerContactType">

                    <option value="">
                        Select Contact Type
                    </option>

                    <option>WhatsApp Number</option>
                    <option>Phone Number</option>
                    <option>Business Contact</option>
                    <option>Email Address</option>
                    <option>Not Provided</option>

                </select>

                <input
                    type="text"
                    id="buyerContact"
                    placeholder="Enter actual phone / WhatsApp number"
                    style="margin-top: 8px;">

            </div>


            <!-- PAYMENT METHOD -->

            <div class="form-group">

                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod">

                    <option value="">
                        Select Payment Method
                    </option>

                    <option>Cash</option>
                    <option>Mobile Money</option>
                    <option>Bank Transfer</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- PAYMENT STATUS -->

            <div class="form-group">

                <label for="paymentStatus">
                    Payment Status
                </label>

                <select id="paymentStatus">

                    <option>Paid</option>
                    <option>Pending</option>
                    <option>Partial</option>

                </select>

            </div>


            <!-- RESPONSIBLE PERSON -->

            <div class="form-group">

                <label for="responsiblePerson">
                    Person Responsible
                </label>

                <select id="responsiblePerson">

                    <option value="">
                        Select Person
                    </option>

                    <option>Farm Manager</option>
                    <option>Owner</option>
                    <option>Sales Officer</option>
                    <option>Farm Worker</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- REMARKS -->

            <div class="form-group full-width">

                <label for="remarks">
                    Sales Performance / Recommendation
                </label>

                <select id="remarks">

                    <option value="">
                        Select Sales Assessment
                    </option>

                    <optgroup label="Sales Going Well">

                        <option>
                            Profitable Sale - Continue Current Pricing
                        </option>

                        <option>
                            Good Sale - Strong Buyer Demand
                        </option>

                        <option>
                            Good Sale - Satisfactory Price
                        </option>

                        <option>
                            Good Sale - Returning Buyer
                        </option>

                        <option>
                            Good Sale - Payment Received
                        </option>

                    </optgroup>


                    <optgroup label="Sales Need Improvement">

                        <option>
                            Low Profit - Review Selling Price
                        </option>

                        <option>
                            Low Profit - Review Production Costs
                        </option>

                        <option>
                            Poor Sale - Seek Better Buyers
                        </option>

                        <option>
                            Poor Sale - Improve Market Search
                        </option>

                        <option>
                            Poor Sale - Negotiate Better Price
                        </option>

                        <option>
                            Sale Below Target - Monitor Market Prices
                        </option>

                    </optgroup>


                    <optgroup label="Payment Concerns">

                        <option>
                            Payment Pending - Follow Up Buyer
                        </option>

                        <option>
                            Partial Payment - Follow Up Balance
                        </option>

                        <option>
                            Payment Delay - Monitor Buyer
                        </option>

                    </optgroup>


                    <optgroup label="Recommendations">

                        <option>
                            Increase Market Search
                        </option>

                        <option>
                            Maintain Current Buyer Relationship
                        </option>

                        <option>
                            Compare Prices Before Sale
                        </option>

                        <option>
                            Improve Sales Planning
                        </option>

                        <option>
                            Consider Bulk Buyers
                        </option>

                        <option>
                            Other Recommendation
                        </option>

                    </optgroup>

                </select>

            </div>


            <!-- PHYSICAL REMOVAL CONFIRMATION -->

            <div class="form-group full-width">

                <label for="removedFromFarm">
                    Have the pigs physically left the farm?
                </label>

                <select id="removedFromFarm" name="removedFromFarm">

                    <option value="false" selected>
                        No — pigs are still on the farm
                    </option>

                    <option value="true">
                        Yes — pigs have left the farm
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="removalDate">
                    Date pigs left the farm
                </label>

                <input
                    type="date"
                    id="removalDate"
                    name="removalDate"
                    disabled>

            </div>


        </div>


        <!-- ==================================================
             ACTION BUTTONS
        ================================================== -->

        <div class="buttons">


            <button
                type="submit"
                class="save-btn"
                data-permission="add"
                data-module="Sales">

                💾 Save Record

            </button>


            <button
                type="button"
                class="update-btn"
                onclick="updateSaleRecord()"
                data-permission="edit"
                data-module="Sales">

                ✏️ Update Record

            </button>


            <button
                type="button"
                onclick="searchSaleRecord()"
                data-permission="view"
                data-module="Sales">

                🔍 Search

            </button>


            <button
                type="button"
                class="report-btn"
                onclick="generateSalesReport()"
                data-permission="report"
                data-module="Sales">

                📊 Report

            </button>


            <button
                type="button"
                class="pdf-btn"
                onclick="downloadSalesPDF()"
                data-permission="report"
                data-module="Sales">

                📄 Download PDF

            </button>


            <button
                type="button"
                class="clear-btn"
                onclick="clearSaleForm()">

                🧹 Clear

            </button>


            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                ↩️ Back

            </button>


        </div>

    </form>


    <!-- ==================================================
         SALES HISTORY
    ================================================== -->

    <div class="history-header">

        <h2>
            Sales Records History
        </h2>

        <span id="recordCount">
            0 Records
        </span>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Date</th>
                    <th>Pig ID</th>
                    <th>Breed</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Weight</th>
                    <th>Total</th>
                    <th>Buyer</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="salesTable">

            </tbody>

        </table>

    </div>


</div>


<!-- ======================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- ======================================================
     FARM BRANDING
====================================================== -->

<script src="farm_branding.js"></script>


<!-- ======================================================
     ACTIVITY
====================================================== -->

<script src="activity.js"></script>


<!-- ======================================================
     SECURITY
====================================================== -->

<script src="security.js"></script>


<!-- ======================================================
     SALES
====================================================== -->

<script src="sales.js"></script>


<!-- ======================================================
     EXPANDED SALES DROPDOWN OPTIONS
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const quantity = document.getElementById("quantity");
    const weight = document.getElementById("weight");
    const pricePerKg = document.getElementById("pricePerKg");


    /* ==================================================
       QUANTITY: 0 - 50,000
    ================================================== */

    if (quantity) {

        for (let i = 0; i <= 50000; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = i;

            quantity.appendChild(option);

        }

    }


    /* ==================================================
       WEIGHT: 0 - 100,000 KG
    ================================================== */

    if (weight) {

        for (let i = 0; i <= 100000; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = i + " kg";

            weight.appendChild(option);

        }

    }


    /* ==================================================
       PRICE PER KG: 0 - 1,000 ZMW
    ================================================== */

    if (pricePerKg) {

        for (let i = 0; i <= 1000; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = "ZMW " + i;

            pricePerKg.appendChild(option);

        }

    }

});

</script>


</body>

</html>
