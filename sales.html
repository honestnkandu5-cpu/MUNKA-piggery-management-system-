<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MUNKA PIGGERY - Sales Records</title>

    <link rel="stylesheet" href="sales.css">

    <!-- ==================================================
         jsPDF
    ================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

</head>


<body>


<div class="container">

    <div class="page-header">

        <div>
            <h1>MUNKA PIGGERY FARM</h1>
            <p class="subtitle">Sales Management System</p>
        </div>

        <div class="module-badge">
            SALES RECORDS
        </div>

    </div>


    <!-- ==================================================
         SALES FORM
    ================================================== -->

    <form id="salesForm">


        <div class="form-grid">


            <!-- RECORD ID -->

            <div class="form-group">

                <label for="recordID">
                    Record ID
                </label>

                <input
                    type="text"
                    id="recordID"
                    readonly
                    placeholder="Automatically generated">

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label for="saleDate">
                    Date of Sale
                </label>

                <input
                    type="date"
                    id="saleDate"
                    required>

            </div>


            <!-- PIG ID -->

            <div class="form-group">

                <label for="pigID">
                    Pig ID
                </label>

                <input
                    type="text"
                    id="pigID"
                    required
                    placeholder="Enter Pig ID">

            </div>


            <!-- BREED -->

            <div class="form-group">

                <label for="breed">
                    Breed
                </label>

                <select id="breed" required>

                    <option value="">
                        Select Breed
                    </option>

                    <option>Large White</option>
                    <option>Landrace</option>
                    <option>Large White × Landrace Cross</option>
                    <option>Duroc</option>
                    <option>Pietrain</option>
                    <option>Hampshire</option>
                    <option>Berkshire</option>
                    <option>Yorkshire</option>
                    <option>Tamworth</option>
                    <option>Chester White</option>
                    <option>Poland China</option>
                    <option>Meishan</option>
                    <option>Cross Breed</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option>Piglet</option>
                    <option>Weaner</option>
                    <option>Grower</option>
                    <option>Finisher</option>
                    <option>Sow</option>
                    <option>Boar</option>

                </select>

            </div>


            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <select id="quantity" required>

                    <option value="">
                        Select Quantity
                    </option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>

                </select>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <select id="weight" required>

                    <option value="">
                        Select Weight
                    </option>

                    <option value="1">1 kg</option>
                    <option value="2">2 kg</option>
                    <option value="3">3 kg</option>
                    <option value="4">4 kg</option>
                    <option value="5">5 kg</option>
                    <option value="6">6 kg</option>
                    <option value="7">7 kg</option>
                    <option value="8">8 kg</option>
                    <option value="9">9 kg</option>
                    <option value="10">10 kg</option>

                    <option value="12">12 kg</option>
                    <option value="15">15 kg</option>
                    <option value="20">20 kg</option>
                    <option value="25">25 kg</option>
                    <option value="30">30 kg</option>
                    <option value="35">35 kg</option>
                    <option value="40">40 kg</option>
                    <option value="45">45 kg</option>
                    <option value="50">50 kg</option>
                    <option value="55">55 kg</option>
                    <option value="60">60 kg</option>
                    <option value="65">65 kg</option>
                    <option value="70">70 kg</option>
                    <option value="75">75 kg</option>
                    <option value="80">80 kg</option>
                    <option value="85">85 kg</option>
                    <option value="90">90 kg</option>
                    <option value="95">95 kg</option>
                    <option value="100">100 kg</option>
                    <option value="110">110 kg</option>
                    <option value="120">120 kg</option>
                    <option value="130">130 kg</option>
                    <option value="140">140 kg</option>
                    <option value="150">150 kg</option>
                    <option value="160">160 kg</option>
                    <option value="170">170 kg</option>
                    <option value="180">180 kg</option>
                    <option value="190">190 kg</option>
                    <option value="200">200 kg</option>
                    <option value="220">220 kg</option>
                    <option value="240">240 kg</option>
                    <option value="260">260 kg</option>
                    <option value="280">280 kg</option>
                    <option value="300">300 kg</option>
                    <option value="320">320 kg</option>
                    <option value="340">340 kg</option>
                    <option value="360">360 kg</option>
                    <option value="380">380 kg</option>
                    <option value="400">400 kg</option>

                </select>

            </div>


            <!-- PRICE PER KG -->

<div class="form-group">

    <label for="pricePerKg">
        Price Per Kg (ZMW)
    </label>

    <select id="pricePerKg" required>

        <option value="">
            Select Price
        </option>

        <option value="5">ZMW 5</option>
        <option value="10">ZMW 10</option>
        <option value="15">ZMW 15</option>
        <option value="20">ZMW 20</option>
        <option value="25">ZMW 25</option>
        <option value="30">ZMW 30</option>
        <option value="35">ZMW 35</option>
        <option value="40">ZMW 40</option>
        <option value="45">ZMW 45</option>
        <option value="50">ZMW 50</option>
        <option value="55">ZMW 55</option>
        <option value="60">ZMW 60</option>
        <option value="65">ZMW 65</option>
        <option value="70">ZMW 70</option>
        <option value="75">ZMW 75</option>
        <option value="80">ZMW 80</option>
        <option value="90">ZMW 90</option>
        <option value="100">ZMW 100</option>
        <option value="110">ZMW 110</option>
        <option value="120">ZMW 120</option>
        <option value="130">ZMW 130</option>
        <option value="140">ZMW 140</option>
        <option value="150">ZMW 150</option>
        <option value="160">ZMW 160</option>
        <option value="170">ZMW 170</option>
        <option value="180">ZMW 180</option>
        <option value="190">ZMW 190</option>
        <option value="200">ZMW 200</option>
        <option value="210">ZMW 210</option>
        <option value="220">ZMW 220</option>
        <option value="230">ZMW 230</option>
        <option value="240">ZMW 240</option>
        <option value="250">ZMW 250</option>
        <option value="260">ZMW 260</option>
        <option value="270">ZMW 270</option>
        <option value="280">ZMW 280</option>
        <option value="290">ZMW 290</option>
        <option value="300">ZMW 300</option>
        <option value="310">ZMW 310</option>
        <option value="320">ZMW 320</option>
        <option value="330">ZMW 330</option>
        <option value="340">ZMW 340</option>
        <option value="350">ZMW 350</option>
        <option value="360">ZMW 360</option>
        <option value="370">ZMW 370</option>
        <option value="380">ZMW 380</option>
        <option value="390">ZMW 390</option>
        <option value="400">ZMW 400</option>

    </select>

</div>
           


            <!-- TOTAL -->

            <div class="form-group">

                <label for="totalAmount">
                    Total Amount (ZMW)
                </label>

                <input
                    type="number"
                    id="totalAmount"
                    readonly
                    placeholder="Automatically calculated">

            </div>


            <!-- BUYER NAME -->

<div class="form-group">

    <label for="buyerName">
        Buyer Name / Company
    </label>

    <select id="buyerCategory">

        <option value="">
            Select Buyer Type
        </option>

        <option>Local Farmer</option>
        <option>Butcher</option>
        <option>Meat Trader</option>
        <option>Pork Processor</option>
        <option>Restaurant</option>
        <option>Hotel</option>
        <option>Individual Buyer</option>
        <option>Wholesaler</option>
        <option>Retailer</option>
        <option>Supermarket</option>
        <option>Farm Business</option>
        <option>Other</option>

    </select>

    <input
        type="text"
        id="buyerName"
        placeholder="Enter actual person's name or company name"
        style="margin-top: 8px;">

</div>


            <!-- BUYER CONTACT -->

<div class="form-group">

    <label for="buyerContact">
        Buyer Contact
    </label>

    <select id="buyerContactType">

        <option value="">
            Select Contact Type
        </option>

        <option>WhatsApp Number</option>
        <option>Phone Number</option>
        <option>Business Contact</option>
        <option>Email Address</option>
        <option>Not Provided</option>

    </select>

    <input
        type="text"
        id="buyerContact"
        placeholder="Enter actual phone / WhatsApp number"
        style="margin-top: 8px;">

</div>


            <!-- PAYMENT METHOD -->

            <div class="form-group">

                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod">

                    <option value="">
                        Select Payment Method
                    </option>

                    <option>Cash</option>
                    <option>Mobile Money</option>
                    <option>Bank Transfer</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- PAYMENT STATUS -->

            <div class="form-group">

                <label for="paymentStatus">
                    Payment Status
                </label>

                <select id="paymentStatus">

                    <option>Paid</option>
                    <option>Pending</option>
                    <option>Partial</option>

                </select>

            </div>


            <!-- RESPONSIBLE PERSON -->

            <div class="form-group">

                <label for="responsiblePerson">
                    Person Responsible
                </label>

                <select id="responsiblePerson">

                    <option value="">
                        Select Person
                    </option>

                    <option>Farm Manager</option>
                    <option>Owner</option>
                    <option>Sales Officer</option>
                    <option>Farm Worker</option>
                    <option>Other</option>

                </select>

            </div>


            <!-- REMARKS -->

            <div class="form-group full-width">

                <label for="remarks">
                    Sales Performance / Recommendation
                </label>

                <select id="remarks">

                    <option value="">
                        Select Sales Assessment
                    </option>

                    <optgroup label="Sales Going Well">

                        <option>
                            Profitable Sale - Continue Current Pricing
                        </option>

                        <option>
                            Good Sale - Strong Buyer Demand
                        </option>

                        <option>
                            Good Sale - Satisfactory Price
                        </option>

                        <option>
                            Good Sale - Returning Buyer
                        </option>

                        <option>
                            Good Sale - Payment Received
                        </option>

                    </optgroup>


                    <optgroup label="Sales Need Improvement">

                        <option>
                            Low Profit - Review Selling Price
                        </option>

                        <option>
                            Low Profit - Review Production Costs
                        </option>

                        <option>
                            Poor Sale - Seek Better Buyers
                        </option>

                        <option>
                            Poor Sale - Improve Market Search
                        </option>

                        <option>
                            Poor Sale - Negotiate Better Price
                        </option>

                        <option>
                            Sale Below Target - Monitor Market Prices
                        </option>

                    </optgroup>


                    <optgroup label="Payment Concerns">

                        <option>
                            Payment Pending - Follow Up Buyer
                        </option>

                        <option>
                            Partial Payment - Follow Up Balance
                        </option>

                        <option>
                            Payment Delay - Monitor Buyer
                        </option>

                    </optgroup>


                    <optgroup label="Recommendations">

                        <option>
                            Increase Market Search
                        </option>

                        <option>
                            Maintain Current Buyer Relationship
                        </option>

                        <option>
                            Compare Prices Before Sale
                        </option>

                        <option>
                            Improve Sales Planning
                        </option>

                        <option>
                            Consider Bulk Buyers
                        </option>

                        <option>
                            Other Recommendation
                        </option>

                    </optgroup>

                </select>

            </div>


        </div>


        <!-- ==================================================
             ACTION BUTTONS
        ================================================== -->

        <div class="buttons">


            <button
                type="submit"
                class="save-btn"
                data-permission="add"
                data-module="Sales">

                💾 Save Record

            </button>


            <button
                type="button"
                class="update-btn"
                onclick="updateSaleRecord()"
                data-permission="edit"
                data-module="Sales">

                ✏️ Update Record

            </button>


            <button
                type="button"
                onclick="searchSaleRecord()"
                data-permission="view"
                data-module="Sales">

                🔍 Search

            </button>


            <button
                type="button"
                class="report-btn"
                onclick="generateSalesReport()"
                data-permission="report"
                data-module="Sales">

                📊 Report

            </button>


            <button
                type="button"
                class="pdf-btn"
                onclick="downloadSalesPDF()"
                data-permission="report"
                data-module="Sales">

                📄 Download PDF

            </button>


            <button
                type="button"
                class="clear-btn"
                onclick="clearSaleForm()">

                🧹 Clear

            </button>


            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                ↩️ Back

            </button>


        </div>

    </form>


    <!-- ==================================================
         SALES HISTORY
    ================================================== -->

    <div class="history-header">

        <h2>
            Sales Records History
        </h2>

        <span id="recordCount">
            0 Records
        </span>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Date</th>
                    <th>Pig ID</th>
                    <th>Breed</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Weight</th>
                    <th>Total</th>
                    <th>Buyer</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="salesTable">

            </tbody>

        </table>

    </div>


</div>


<!-- ======================================================
     ACTIVITY
====================================================== -->

<script src="activity.js"></script>


<!-- ======================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- ======================================================
     SECURITY
====================================================== -->

<script src="security.js"></script>


<!-- ======================================================
     SALES
====================================================== -->

<script src="sales.js"></script>


</body>

</html>
