<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MUNKA PIGGERY - Reset Super Admin MFA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #064e3b,
                #047857,
                #2563eb
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;

            background: white;

            border-radius: 25px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.25);
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }

        h1 {
            color: #065f46;
            font-size: 34px;
            margin: 15px 0 5px;
        }

        h2 {
            color: #2563eb;
            font-size: 25px;
            margin: 5px 0 25px;
        }

        .warning {
            background: #fff7ed;
            border: 2px solid #fdba74;
            color: #9a3412;

            border-radius: 15px;

            padding: 18px;

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        button {
            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 14px;

            background: #dc2626;

            color: white;

            font-size: 21px;

            font-weight: 800;

            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            font-size: 17px;

            line-height: 1.5;

            display: none;
        }

        .success {
            display: block;

            background: #dcfce7;

            color: #166534;

            border: 1px solid #86efac;
        }

        .error {
            display: block;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fca5a5;
        }
    </style>
</head>

<body>

<div class="card">

    <img
        src="munka-logo.png"
        alt="MUNKA PIGGERY Logo"
        class="logo"
    >

    <h1>MUNKA PIGGERY</h1>

    <h2>Super Admin MFA Reset</h2>

    <div class="warning">
        <strong>Important</strong><br><br>

        This will remove the existing
        Super Admin authenticator factor
        from Supabase.

        You will then be able to create
        a completely new MFA setup.

        Do this only once.
    </div>

    <button
        id="resetButton"
        type="button"
    >
        REMOVE EXISTING MFA
    </button>

    <div
        id="message"
        class="message"
    ></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="reset_mfa.js?v=1"></script>

</body>
</html>
