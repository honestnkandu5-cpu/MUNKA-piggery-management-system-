<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MUNKA PIGGERY - Change Password</title>

<link rel="stylesheet" href="change_password.css">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- CLOUDFLARE TURNSTILE -->
<script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer>
</script>

</head><body><div class="container"><h1>MUNKA PIGGERY FARM LIMITED</h1>

<h2>Change Password</h2>

<form id="passwordForm">

    <label for="oldPassword">Current Password</label>
    <input
        type="password"
        id="oldPassword"
        placeholder="Enter current password"
        autocomplete="current-password"
        required
    >

    <label for="newPassword">New Password</label>
    <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
        required
    >

    <label for="confirmPassword">Confirm New Password</label>
    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
        required
    >

    <!-- TURNSTILE CAPTCHA -->
    <div
        id="changePasswordCaptcha"
        style="margin: 18px 0; display: flex; justify-content: center;">
    </div>

    <button
        type="submit"
        id="updatePasswordBtn">
        Update Password
    </button>

    <button
        type="button"
        id="backButton">
        Back
    </button>

    <p id="message" role="status" aria-live="polite"></p>

</form>

</div><script src="change_password.js"></script></body>
</html>
