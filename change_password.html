<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MUNKA PIGGERY - Change Password</title>

    <link rel="stylesheet" href="change_password.css">

    <!-- CLOUDFLARE TURNSTILE -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
        async
        defer
    ></script>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>

<body>

    <div class="container">

        <h1 id="farmNameHeading">Loading farm name...</h1>

        <h2>Change Password</h2>

        <p>
            Verify your current password before creating a new one.
        </p>

        <form id="passwordForm">

            <!-- CURRENT PASSWORD -->

            <label for="oldPassword">
                Current Password
            </label>

            <input
                type="password"
                id="oldPassword"
                placeholder="Enter current password"
                autocomplete="current-password"
                required
            >

            <!-- NEW PASSWORD -->

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <!-- CLOUDFLARE CAPTCHA -->

            <div class="captcha-section">

                <p>
                    Complete the security check before updating your password.
                </p>

                <div
                    id="changePasswordCaptcha"
                    class="turnstile-container"
                ></div>

            </div>

            <!-- UPDATE PASSWORD -->

            <button
                type="submit"
                id="updatePasswordBtn"
            >
                Update Password
            </button>

            <!-- BACK BUTTON -->

            <button
                type="button"
                id="backButton"
            >
                Back to Dashboard
            </button>

            <!-- STATUS MESSAGE -->

            <p
                id="message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <footer>
            MUNKA PIGGERY TECHNOLOGY
            <br>
            Professional Farm Management &amp; Records System
        </footer>

    </div>

    <!-- CHANGE PASSWORD LOGIC -->

    <script src="change_password.js"></script>

</body>

</html>
