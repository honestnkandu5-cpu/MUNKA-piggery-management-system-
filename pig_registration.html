<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    MUNKA PIGGERY - Pig Registration
</title>

<link
    rel="stylesheet"
    href="pig.css">

</head>


<body>


<div class="container">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="page-header">

        <div class="pig-icon">
            🐖
        </div>

        <div>

            <h1>
                MUNKA PIGGERY
            </h1>

            <p>
                Pig Registration Management
            </p>

        </div>

    </div>


    <!-- =====================================================
         REGISTRATION FORM
    ====================================================== -->

    <section class="form-section">

        <div class="section-title">

            <div>

                <span>
                    PIG MANAGEMENT
                </span>

                <h2>
                    Register Pig
                </h2>

            </div>

        </div>


        <form id="pigForm">


            <!-- PIG ID -->

            <div class="form-group">

                <label for="pigID">
                    Pig ID
                </label>

                <input
                    type="text"
                    id="pigID"
                    placeholder="Enter Pig ID"
                    autocomplete="off"
                    required>

            </div>


            <!-- BREED -->

            <div class="form-group">

                <label for="breed">
                    Breed
                </label>

                <select
                    id="breed"
                    required>

                    <option value="">
                        Select Breed
                    </option>

                    <option>
                        Large White
                    </option>

                    <option>
                        Landrace
                    </option>

                    <option>
                        Duroc
                    </option>

                    <option>
                        Pietrain
                    </option>

                    <option>
                        Hampshire
                    </option>

                    <option>
                        Berkshire
                    </option>

                    <option>
                        Yorkshire
                    </option>

                    <option>
                        Tamworth
                    </option>

                    <option>
                        Chester White
                    </option>

                    <option>
                        Poland China
                    </option>

                    <option>
                        Meishan
                    </option>

                    <option>
                        Cross Breed
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <!-- SEX -->

            <div class="form-group">

                <label for="sex">
                    Sex
                </label>

                <select
                    id="sex"
                    required>

                    <option value="">
                        Select Sex
                    </option>

                    <option>
                        Male
                    </option>

                    <option>
                        Female
                    </option>

                </select>

            </div>


            <!-- FARROW DATE -->

            <div class="form-group">

                <label for="farrowDate">
                    Farrow Date
                </label>

                <input
                    type="date"
                    id="farrowDate"
                    required>

            </div>


            <!-- SOURCE -->

            <div class="form-group">

                <label for="source">
                    Source (Farm name/Seller name)
                </label>

                <input
                    type="text"
                    id="source"
                    placeholder="Enter Farm name or Seller name"
                    autocomplete="off"
                    required>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight (Kg)
                </label>

                <select
                    id="weight"
                    required>

                    <option value="">
                        Select Weight
                    </option>

                    <option value="1">
                        1 Kg
                    </option>

                    <option value="2">
                        2 Kg
                    </option>

                    <option value="3">
                        3 Kg
                    </option>

                    <option value="4">
                        4 Kg
                    </option>

                    <option value="5">
                        5 Kg
                    </option>

                    <option value="6">
                        6 Kg
                    </option>

                    <option value="7">
                        7 Kg
                    </option>

                    <option value="8">
                        8 Kg
                    </option>

                    <option value="9">
                        9 Kg
                    </option>

                    <option value="10">
                        10 Kg
                    </option>

                    <option value="15">
                        15 Kg
                    </option>

                    <option value="20">
                        20 Kg
                    </option>

                    <option value="25">
                        25 Kg
                    </option>

                    <option value="30">
                        30 Kg
                    </option>

                    <option value="35">
                        35 Kg
                    </option>

                    <option value="40">
                        40 Kg
                    </option>

                    <option value="45">
                        45 Kg
                    </option>

                    <option value="50">
                        50 Kg
                    </option>

                    <option value="55">
                        55 Kg
                    </option>

                    <option value="60">
                        60 Kg
                    </option>

                    <option value="65">
                        65 Kg
                    </option>

                    <option value="70">
                        70 Kg
                    </option>

                    <option value="75">
                        75 Kg
                    </option>

                    <option value="80">
                        80 Kg
                    </option>

                    <option value="85">
                        85 Kg
                    </option>

                    <option value="90">
                        90 Kg
                    </option>

                    <option value="95">
                        95 Kg
                    </option>

                    <option value="100">
                        100 Kg
                    </option>

                    <option value="110">
                        110 Kg
                    </option>

                    <option value="120">
                        120 Kg
                    </option>

                    <option value="130">
                        130 Kg
                    </option>

                    <option value="140">
                        140 Kg
                    </option>

                    <option value="150">
                        150 Kg
                    </option>
          <option value="160">160 Kg</option>
<option value="170">170 Kg</option>
<option value="180">180 Kg</option>
<option value="190">190 Kg</option>
<option value="200">200 Kg</option>
<option value="210">210 Kg</option>
<option value="220">220 Kg</option>
<option value="230">230 Kg</option>
<option value="240">240 Kg</option>
<option value="250">250 Kg</option>
<option value="260">260 Kg</option>
<option value="270">270 Kg</option>
<option value="280">280 Kg</option>
<option value="290">290 Kg</option>
<option value="300">300 Kg</option>
<option value="310">310 Kg</option>
<option value="320">320 Kg</option>
<option value="330">330 Kg</option>
<option value="340">340 Kg</option>
<option value="350">350 Kg</option>
<option value="360">360 Kg</option>
<option value="370">370 Kg</option>
<option value="380">380 Kg</option>
<option value="390">390 Kg</option>
<option value="400">400 Kg</option>   
                </select>

            </div>


            <!-- HEALTH STATUS -->

            <div class="form-group">

                <label for="healthStatus">
                    Health Status
                </label>

                <select
                    id="healthStatus"
                    required>

                    <option value="">
                        Select Health Status
                    </option>

                    <option>
                        Healthy
                    </option>

                    <option>
                        Sick
                    </option>

                    <option>
                        Under Treatment
                    </option>

                    <option>
                        Recovered
                    </option>

                    <option>
                        Dead
                    </option>

                </select>

            </div>


            <!-- =================================================
                 FORM BUTTONS
            ================================================== -->

            <div class="buttons">


                <button
                    type="submit"
                    data-permission="add"
                    data-module="Pig Registration">

                    💾 Save Pig Record

                </button>


                <button
                    type="button"
                    onclick="clearForm()"
                    class="secondary-button">

                    🧹 Clear

                </button>


                <button
                    type="button"
                    onclick="window.location.href='dashboard.html'"
                    class="secondary-button">

                    ↩️ Back

                </button>


            </div>


        </form>

    </section>


    <!-- =====================================================
         SEARCH SECTION
    ====================================================== -->

    <section class="records-section">


        <div class="section-title">

            <div>

                <span>
                    RECORD MANAGEMENT
                </span>

                <h2>
                    Search Pig Records
                </h2>

            </div>

        </div>


        <div class="search-area">

            <input
                type="text"
                id="searchPig"
                placeholder="Search by Pig ID or Breed"
                autocomplete="off">


            <button
                type="button"
                onclick="searchPig()"
                data-permission="view"
                data-module="Pig Registration">

                🔍 Search

            </button>

        </div>


    </section>


    <!-- =====================================================
         REGISTERED PIGS
    ====================================================== -->

    <section class="records-section">


        <div class="section-title">

            <div>

                <span>
                    FARM RECORDS
                </span>

                <h2>
                    Registered Pigs
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table>


                <thead>

                    <tr>

                        <th>
                            Pig ID
                        </th>

                        <th>
                            Breed
                        </th>

                        <th>
                            Sex
                        </th>

                        <th>
                            Farrow Date
                        </th>

                        <th>
                            Source
                        </th>

                        <th>
                            Weight
                        </th>

                        <th>
                            Health Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="pigTable">
                </tbody>


            </table>

        </div>


    </section>


    <!-- =====================================================
         REPORT SECTION
    ====================================================== -->

    <section class="report-section">


        <div class="section-title">

            <div>

                <span>
                    REPORTING
                </span>

                <h2>
                    Pig Registration Reports
                </h2>

            </div>

        </div>


        <div class="report-buttons">


            <button
                type="button"
                onclick="generateReport()"
                data-permission="report"
                data-module="Pig Registration">

                📊 Generate Report

            </button>


            <button
                type="button"
                onclick="printReport()"
                data-permission="report"
                data-module="Pig Registration"
                class="print-button">

                🖨️ Print

            </button>


            <button
                type="button"
                onclick="downloadPDF()"
                data-permission="report"
                data-module="Pig Registration"
                class="pdf-button">

                📥 Download PDF

            </button>


        </div>


    </section>


</div>


<!-- =====================================================
     SUPABASE
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- =====================================================
     PDF LIBRARY
====================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
</script>


<!-- =====================================================
     SUPABASE CONFIGURATION
====================================================== -->

<script src="supabase.js"></script>


<!-- =====================================================
     ACTIVITY LOG
====================================================== -->

<script src="activity.js"></script>


<!-- =====================================================
     SECURITY
====================================================== -->

<script src="security.js"></script>


<!-- =====================================================
     PIG REGISTRATION JAVASCRIPT
====================================================== -->

<script src="pig.js"></script>


</body>

</html>
