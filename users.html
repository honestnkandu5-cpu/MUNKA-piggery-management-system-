<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registered Farm - User Management</title>

<link rel="stylesheet" href="users.css">

<link rel="stylesheet" href="farm_branding.css">

</head>


<body>


<div class="container">


<!-- =========================================================
     MUNKA PIGGERY TECHNOLOGY + REGISTERED FARM BRANDING
========================================================= -->

<header class="users-header">

    <div class="brand-icon">
        🐖
    </div>

    <div class="brand-content">

        <div class="software-brand">
            MUNKA PIGGERY TECHNOLOGY
        </div>

        <p>
            Piggery Management System
        </p>

        <div class="farm-branding">

            <span class="farm-label">
                REGISTERED FARM
            </span>

            <strong data-farm-name>
                Loading farm...
            </strong>

        </div>

    </div>

</header>


<h2>User Management</h2>


<form id="userForm">


<div class="form-group">

<label>User ID</label>

<input
type="text"
id="userID"
readonly
>

</div>


<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter Full Name"
required
>

</div>


<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required
>

</div>


<div class="form-group">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Create Username"
required
>

</div>


<div class="form-group">

<label>Initial Password</label>

<input
type="password"
id="password"
placeholder="Create Initial Password"
minlength="6"
required
>

</div>


<div class="form-group">

<label>Role</label>

<select id="role" required>

<option value="">
Select Role
</option>

<option value="Owner/Admin">
Owner/Admin
</option>

<option value="Farm Manager">
Farm Manager
</option>

<option value="Serviceman (Gestation Pen)">
Serviceman (Gestation Pen)
</option>

<option value="Farrowman (Farrowing Pen)">
Farrowman (Farrowing Pen)
</option>

<option value="Sales Officer">
Sales Officer
</option>

<option value="Veterinary Officer">
Veterinary Officer
</option>

<option value="Farm Worker">
Farm Worker
</option>

</select>

</div>


<div class="form-group">

<label>Status</label>

<select id="status">

<option value="Active">
Active
</option>

<option value="Inactive">
Inactive
</option>

</select>

</div>


<div class="buttons">


<button
type="button"
onclick="saveUser()"
>
Save User
</button>


<button
type="button"
onclick="updateUser()"
>
Update User
</button>


<button
type="button"
onclick="clearForm()"
>
Clear
</button>


<button
type="button"
onclick="downloadUsersPDF()"
class="pdf-button"
>
Download PDF
</button>


<button
type="button"
onclick="window.location.href='dashboard.html'"
>
Back to Dashboard
</button>


</div>


</form>


<h2>Registered Users</h2>


<div style="overflow-x:auto;">


<table
id="usersTable"
border="1"
>


<thead>

<tr>

<th>User ID</th>

<th>Full Name</th>

<th>Email</th>

<th>Username</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="userTable">

</tbody>


</table>


</div>


</div>



<!-- =========================================================
     jsPDF
========================================================= -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<!-- =========================================================
     jsPDF AutoTable
========================================================= -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
</script>


<!-- =========================================================
     Supabase
========================================================= -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="supabase.js"></script>


<!-- =========================================================
     FARM BRANDING
========================================================= -->

<script src="farm_branding.js"></script>


<!-- =========================================================
     Activity Log
========================================================= -->

<script src="activity.js"></script>


<!-- =========================================================
     Security
========================================================= -->

<script src="security.js"></script>


<!-- =========================================================
     User Management
========================================================= -->

<script src="users.js"></script>


</body>

</html>
