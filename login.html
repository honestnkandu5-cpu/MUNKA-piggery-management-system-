* {

}

html,

body {

    justify-content: center;

.login-container {

    width: min(1180px, 94%);

    min-height: 720px;

    margin: 30px auto;

    padding:

        65px

    background: #ffffff;

    border-radius: 26px;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 30px 80px

}

.login-container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 9px;

    background:

        linear-gradient(
            90deg,

            #c62828 0%,
            #c62828 20%,

            #087f4b 20%,
            #087f4b 50%,

            #0d6efd 50%,
            #0d6efd 75%,

            #d4af37 75%,
            #d4af37 100%
        );
}

.login-container::after {

    content: "";

    position: absolute;

    width: 360px;
    height: 360px;

    border-radius: 50%;

    right: -180px;
    bottom: -180px;

    background:
        rgba(8, 127, 75, 0.07);

    pointer-events: none;
}

.brand-icon {

    width: 125px;
    height: 125px;

    margin:
        8px auto 14px;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    z-index: 2;
}

.brand-logo {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 6px 10px

}

.login-container h1 {

    margin: 0;

    text-align: center;

    font-size:

    font-weight: 900;

    color: #075e3b;
}

.login-container h3 {

    margin:
        7px 0 0;

    text-align: center;

    font-size:
        clamp(13px, 1.6vw, 18px);

    font-weight: 800;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #0d6efd;
}

.login-container h3::after {

    content: "";

    display: block;

    width: 75px;

    height: 4px;

    margin:
        12px auto 0;

    border-radius: 10px;

    background: #d4af37;
}

.welcome {

        32px 0 7px;

    font-size:

    font-weight: 850;

    color: #17231c;

.login-instruction {

#loginForm {

.role-title {

    color: #075e3b;

}

    margin-bottom: 10px;
}

.role-button {

    background:

}

.role-button:hover {

}

.role-button.selected {

}

.selected-role {

        8px 0 17px;

        14px;

    font-weight:

}

.login-container input {

    height: 58px;

    padding:
        0 18px;

    margin-bottom: 14px;

    border-radius: 11px;

    border:
        1px solid #d5e0da;

    background:
        #f9fcfa;

    color:
        #17231c;

    font-size:
        16px;

    transition:

}

.login-container input::placeholder {

    color:
        #9aa59f;
}

.login-container input:hover {

    border-color:
        #9bbcaf;
}

.login-container input:focus {

    border:
        2px solid #087f4b;

    background:
        #ffffff;

    box-shadow:
        0 0 0 4px
        rgba(8, 127, 75, 0.10);
}

.password-container {

    position: relative;

    width: 100%;
}

.password-container input {

    padding-right:
        85px;
}

#togglePassword {

    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    width: auto;

    height: auto;

    margin: 0;

    padding:
        8px 11px;

    border: none;

    border-radius: 7px;

    background:
        transparent;

    color:
        #087f4b;

    font-size:
        14px;

    font-weight:
        850;

    cursor:
        pointer;
}

#togglePassword:hover {

    background:
        #e9f7f0;

    color:
        #075e3b;
}

.forgot-password {

    text-align:
        right;

    margin:
        0 0 20px;
}

.forgot-password a {

    color:
        #0d6efd;

        14px;

        750;

}

.forgot-password a:hover {

    color:

    text-decoration:
        underline;
}


/* =========================================================
   CLOUDFLARE TURNSTILE

.turnstile-container {

<body>

<div class="login-container">

    <div class="brand-icon">

        <img
            src="munka-logo.png"
            alt="MUNKA PIGGERY Management System"
            class="brand-logo"
        >

    </div>

    <h1>
        MUNKA PIGGERY
    </h1>

    <h3>
        Farm Management System
    </h3>

    <div class="welcome">
        Welcome Back
    </div>

    <p class="login-instruction">
        Sign in to manage your farm operations
    </p>

    <form id="loginForm">

        <div class="role-title">
            Select Your Role
        </div>

        <div class="roles-container">

            <button
                type="button"
                class="role-button"
                data-role="owner/admin"
            >
                Owner / Admin
            </button>

            <button
                type="button"
                class="role-button"
                data-role="farm manager"
            >
                Farm Manager
            </button>

            <button
                type="button"
                class="role-button"
                data-role="serviceman"
            >
                Serviceman<br>
                (Gestation Pen)
            </button>

            <button
                type="button"
                class="role-button"
                data-role="farrowman"
            >
                Farrowman<br>
                (Farrowing Pen)
            </button>

            <button
                type="button"
                class="role-button"
                data-role="sales officer"
            >
                Sales Officer
            </button>

            <button
                type="button"
                class="role-button"
                data-role="veterinary officer"
            >
                Veterinary Officer
            </button>

            <button
                type="button"
                class="role-button"
                data-role="farm worker"
            >
                Farm Worker
            </button>

        </div>

        <div
            id="selectedRole"
            class="selected-role"
        ></div>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                id="togglePassword"
            >
                Show
            </button>

        </div>

        <div class="forgot-password">

            <a href="forgot_password.html">
                Forgot Password?
            </a>

        </div>

        <!-- =================================================
             CLOUDFLARE TURNSTILE
        ================================================== -->

        <div class="turnstile-container">

            <div
                class="cf-turnstile"
                data-sitekey="0x4AAAAAAFMo7xO_ThI6laYl"
                data-theme="light"
            ></div>

        </div>

        <button
            type="submit"
            class="login-button"
        >
            🌿 LOGIN TO FARM
        </button>

        <p id="message"></p>

    </form>

    <div class="farm-footer">

        <strong>
            MUNKA PIGGERY TECHNOLOGY
        </strong>

        <br>

        Professional Farm Management &amp; Records System

    </div>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="activity.js"></script>

<script src="login.js"></script>

<!-- ROLE + PASSWORD UI -->

<script>

const roleButtons =
    document.querySelectorAll(".role-button");

const selectedRole =
    document.getElementById("selectedRole");

let selectedRoleValue = "";

roleButtons.forEach(button => {

    button.addEventListener("click", () => {

        roleButtons.forEach(btn => {
            btn.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedRoleValue =
            button.dataset.role;

        selectedRole.textContent =
            "Selected role: " +
            button.textContent
                .replace(/\s+/g, " ")
                .trim();

    });

});

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener(
    "click",
    () => {

        if (
            password.type === "password"
        ) {

            password.type =
                "text";

            togglePassword.textContent =
                "Hide";

        } else {

            password.type =
                "password";

            togglePassword.textContent =
                "Show";

        }

    }
);

</script>
