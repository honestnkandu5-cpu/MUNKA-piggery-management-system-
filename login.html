<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MUNKA PIGGERY - Login</title><style>

/* =========================================================
   MUNKA PIGGERY TECHNOLOGY
   FULL-SCREEN FARMTECH LOGIN
   GREEN + GOLD + BLACK + WHITE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #17231c;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(53,168,83,0.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(212,175,55,0.16),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #06281c 0%,
            #0b3d2e 48%,
            #061b14 100%
        );
}


/* =========================================================
   FULL SCREEN LOGIN CONTAINER
========================================================= */

.login-container {

    width: 100%;
    min-height: 100vh;

    padding:
        55px
        7vw
        40px;

    background: rgba(255,255,255,0.98);

    position: relative;

    overflow-y: auto;

    border: none;

    box-shadow: none;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* TOP BRAND STRIPE */

.login-container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 7px;

    background:
        linear-gradient(
            90deg,
            #0b3d2e,
            #198754,
            #35a853,
            #d4af37,
            #198754,
            #0b3d2e
        );
}


/* =========================================================
   BRAND LOGO
========================================================= */

.brand-icon {

    width: 120px;
    height: 120px;

    margin:
        5px
        auto
        15px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: transparent;

    border: none;

    box-shadow: none;
}

.brand-logo {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}


/* =========================================================
   BRAND NAME
========================================================= */

.login-container h1 {

    margin: 0;

    font-size: clamp(
        30px,
        4vw,
        48px
    );

    font-weight: 900;

    letter-spacing: 2px;

    text-align: center;

    color: #0b3d2e;
}


.login-container h3 {

    margin:
        7px
        0
        0;

    font-size: clamp(
        13px,
        1.5vw,
        17px
    );

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-align: center;

    color: #198754;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    margin:
        35px
        0
        7px;

    font-size: clamp(
        25px,
        3vw,
        34px
    );

    font-weight: 800;

    color: #17231c;

    text-align: center;
}


.login-instruction {

    margin:
        0
        0
        28px;

    font-size: 15px;

    color: #6b756f;

    text-align: center;
}


/* =========================================================
   MAIN FORM AREA
========================================================= */

#loginForm {

    width: 100%;

    max-width: 1100px;
}


/* =========================================================
   ROLE SELECTION
========================================================= */

.role-title {

    margin-bottom: 14px;

    font-size: 15px;

    font-weight: 800;

    color: #0b3d2e;

    text-transform: uppercase;

    letter-spacing: 0.8px;
}


.roles-container {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    gap: 13px;

    margin-bottom: 12px;
}


.role-button {

    width: 100%;

    min-height: 65px;

    padding: 11px;

    border-radius: 13px;

    border:
        1px solid
        #d9e4dd;

    background: #ffffff;

    color: #26352d;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        0.2s ease;

    box-shadow:
        0
        3px
        10px
        rgba(11,61,46,0.06);
}


.role-button:hover {

    transform:
        translateY(-2px);

    border-color:
        #35a853;

    background:
        #f0faf3;

    box-shadow:
        0
        7px
        18px
        rgba(25,135,84,0.15);
}


.role-button.selected {

    color: #ffffff;

    border-color:
        #d4af37;

    background:
        linear-gradient(
            135deg,
            #0b3d2e,
            #198754
        );

    box-shadow:
        0
        8px
        20px
        rgba(11,61,46,0.25);

    transform:
        translateY(-2px);
}


/* =========================================================
   SELECTED ROLE
========================================================= */

.selected-role {

    min-height: 23px;

    margin:
        8px
        0
        17px;

    color:
        #198754;

    font-size: 14px;

    font-weight: 800;
}


/* =========================================================
   INPUTS
========================================================= */

.login-container input {

    width: 100%;

    height: 58px;

    padding:
        0
        17px;

    margin-bottom: 14px;

    border-radius: 11px;

    border:
        1px solid
        #d8e1dc;

    background:
        #fbfdfc;

    color:
        #17231c;

    font-size: 16px;

    outline: none;

    transition:
        0.2s ease;
}


.login-container input::placeholder {

    color:
        #98a29d;
}


.login-container input:focus {

    border-color:
        #198754;

    background:
        #ffffff;

    box-shadow:
        0
        0
        0
        3px
        rgba(25,135,84,0.12);
}


/* =========================================================
   PASSWORD
========================================================= */

.password-container {

    position: relative;

    width: 100%;
}


.password-container input {

    padding-right: 80px;
}


#togglePassword {

    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    width: auto;

    height: auto;

    margin: 0;

    padding:
        8px
        10px;

    border: none;

    border-radius: 7px;

    background:
        transparent;

    color:
        #198754;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;
}


#togglePassword:hover {

    background:
        #eaf7ef;

    color:
        #0b3d2e;
}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

.forgot-password {

    text-align: right;

    margin:
        0
        0
        20px;
}


.forgot-password a {

    color:
        #198754;

    font-size:
        14px;

    font-weight:
        700;

    text-decoration:
        none;
}


.forgot-password a:hover {

    color:
        #0b3d2e;

    text-decoration:
        underline;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {

    width: 100%;

    height: 60px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #0b3d2e,
            #198754 60%,
            #d4af37
        );

    color:
        #ffffff;

    font-size:
        17px;

    font-weight:
        800;

    letter-spacing:
        0.6px;

    cursor:
        pointer;

    box-shadow:
        0
        9px
        22px
        rgba(11,61,46,0.25);

    transition:
        0.2s ease;
}


.login-button:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.06);

    box-shadow:
        0
        13px
        27px
        rgba(11,61,46,0.32);
}


.login-button:active {

    transform:
        translateY(0);
}


/* =========================================================
   MESSAGE
========================================================= */

#message {

    min-height:
        20px;

    margin:
        13px
        0
        0;

    font-size:
        14px;

    font-weight:
        700;

    line-height:
        1.4;

    color:
        #c62828;
}


/* =========================================================
   FOOTER
========================================================= */

.farm-footer {

    width:
        100%;

    max-width:
        1100px;

    margin-top:
        28px;

    padding-top:
        17px;

    border-top:
        1px solid
        #e4ebe7;

    text-align:
        center;

    font-size:
        13px;

    color:
        #7b857f;
}


.farm-footer strong {

    color:
        #198754;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .login-container {

        padding:
            45px
            35px
            30px;
    }

    .roles-container {

        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {

        min-height:
            100vh;
    }


    .login-container {

        min-height:
            100vh;

        padding:
            38px
            18px
            25px;
    }


    .brand-icon {

        width:
            90px;

        height:
            90px;

        margin-bottom:
            12px;
    }


    .login-container h1 {

        font-size:
            28px;

        letter-spacing:
            1.5px;
    }


    .login-container h3 {

        font-size:
            11px;

        letter-spacing:
            1.5px;
    }


    .welcome {

        margin-top:
            25px;

        font-size:
            23px;
    }


    .login-instruction {

        font-size:
            13px;
    }


    .roles-container {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:
            9px;
    }


    .role-button {

        min-height:
            58px;

        padding:
            9px
            5px;

        font-size:
            11.5px;
    }


    .login-container input {

        height:
            54px;

        font-size:
            15px;
    }


    .login-button {

        height:
            56px;

        font-size:
            15px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .login-container {

        padding:
            32px
            13px
            20px;
    }


    .brand-icon {

        width:
            78px;

        height:
            78px;
    }


    .login-container h1 {

        font-size:
            24px;
    }


    .welcome {

        font-size:
            20px;
    }


    .role-button {

        min-height:
            53px;

        font-size:
            10.5px;
    }
}

</style></head><body><div class="login-container"><!-- =====================================================
     REAL MUNKA PIGGERY LOGO
====================================================== -->

<div class="brand-icon">

    <img
        src="munka-logo.png"
        alt="MUNKA PIGGERY Management System"
        class="brand-logo"
    >

</div>


<!-- BRAND -->

<h1>
    MUNKA PIGGERY
</h1>

<h3>
    Farm Management System
</h3>


<!-- WELCOME -->

<div class="welcome">
    Welcome Back
</div>

<p class="login-instruction">
    Sign in to manage your farm operations
</p>


<!-- ROLE -->

<form id="loginForm">


    <div class="role-title">
        Select Your Role
    </div>


    <div class="roles-container">


        <button
            type="button"
            class="role-button"
            data-role="owner/admin">

            Owner / Admin

        </button>


        <button
            type="button"
            class="role-button"
            data-role="farm manager">

            Farm Manager

        </button>


        <button
            type="button"
            class="role-button"
            data-role="serviceman">

            Serviceman<br>
            (Gestation Pen)

        </button>


        <button
            type="button"
            class="role-button"
            data-role="farrowman">

            Farrowman<br>
            (Farrowing Pen)

        </button>


        <button
            type="button"
            class="role-button"
            data-role="sales officer">

            Sales Officer

        </button>


        <button
            type="button"
            class="role-button"
            data-role="veterinary officer">

            Veterinary Officer

        </button>


        <button
            type="button"
            class="role-button"
            data-role="farm worker">

            Farm Worker

        </button>


    </div>


    <div
        id="selectedRole"
        class="selected-role">
    </div>


    <!-- EMAIL -->

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
        required
    >


    <!-- PASSWORD -->

    <div class="password-container">

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            id="togglePassword">

            Show

        </button>

    </div>


    <!-- FORGOT PASSWORD -->

    <div class="forgot-password">

        <a href="forgot_password.html">
            Forgot Password?
        </a>

    </div>


    <!-- LOGIN -->

    <button
        type="submit"
        class="login-button">

        🌿 LOGIN TO FARM

    </button>


    <p id="message"></p>


</form>


<!-- FOOTER -->

<div class="farm-footer">

    <strong>
        MUNKA PIGGERY TECHNOLOGY
    </strong>

    <br>

    Professional Farm Management &amp; Records System

</div>

</div><!-- =========================================================
     SUPABASE
========================================================= --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="activity.js"></script><script src="login.js"></script><!-- =========================================================
     ROLE + PASSWORD UI
========================================================= --><script>

const roleButtons =
    document.querySelectorAll(".role-button");

const selectedRole =
    document.getElementById("selectedRole");

let selectedRoleValue = "";


/* ROLE SELECTION */

roleButtons.forEach(button => {

    button.addEventListener("click", () => {

        roleButtons.forEach(btn => {

            btn.classList.remove("selected");

        });


        button.classList.add("selected");


        selectedRoleValue =
            button.dataset.role;


        selectedRole.textContent =
            "Selected role: " +
            button.textContent
                .replace(/\s+/g, " ")
                .trim();

    });

});


/* PASSWORD SHOW / HIDE */

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


togglePassword.addEventListener(
    "click",
    () => {

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            togglePassword.textContent =
                "Hide";

        }

        else {

            password.type =
                "password";

            togglePassword.textContent =
                "Show";

        }

    }
);

</script></body>
</html>
