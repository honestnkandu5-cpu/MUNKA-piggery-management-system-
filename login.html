<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUNKA PIGGERY - Login</title>

<style>

/* =========================================================
   MUNKA PIGGERY TECHNOLOGY
   FRESH FARMTECH LOGIN DESIGN
   GREEN + GOLD + BLACK + WHITE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    color: #17231c;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(53,168,83,0.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(212,175,55,0.16),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #06281c 0%,
            #0b3d2e 48%,
            #061b14 100%
        );
}


/* =========================================================
   MAIN CARD
========================================================= */

.login-container {

    width: 100%;
    max-width: 760px;

    background: rgba(255,255,255,0.98);

    border-radius: 26px;

    padding: 38px 42px 34px;

    position: relative;

    overflow: hidden;

    border: 1px solid rgba(212,175,55,0.45);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 40px rgba(53,168,83,0.12);
}


/* TOP BRAND STRIPE */

.login-container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 6px;

    background:
        linear-gradient(
            90deg,
            #0b3d2e,
            #198754,
            #35a853,
            #d4af37,
            #198754,
            #0b3d2e
        );
}


/* =========================================================
   BRAND
========================================================= */

.brand-icon {

    width: 68px;
    height: 68px;

    margin: 4px auto 12px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #0b3d2e,
            #198754
        );

    color: #ffffff;

    font-size: 31px;

    border: 3px solid #d4af37;

    box-shadow:
        0 8px 20px rgba(11,61,46,0.25);
}


.login-container h1 {

    margin: 0;

    font-size: 35px;

    font-weight: 900;

    letter-spacing: 2px;

    color: #0b3d2e;
}


.login-container h3 {

    margin: 5px 0 0;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    color: #198754;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    margin: 28px 0 5px;

    font-size: 26px;

    font-weight: 800;

    color: #17231c;
}


.login-instruction {

    margin: 0 0 24px;

    font-size: 14px;

    color: #6b756f;
}


/* =========================================================
   ROLE SELECTION
========================================================= */

.role-title {

    margin-bottom: 12px;

    font-size: 14px;

    font-weight: 800;

    color: #0b3d2e;

    text-transform: uppercase;

    letter-spacing: 0.8px;
}


.roles-container {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 11px;

    margin-bottom: 10px;
}


.role-button {

    width: 100%;

    min-height: 58px;

    padding: 10px;

    border-radius: 13px;

    border: 1px solid #d9e4dd;

    background: #ffffff;

    color: #26352d;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition:
        0.2s ease;

    box-shadow:
        0 3px 10px rgba(11,61,46,0.06);
}


.role-button:hover {

    transform: translateY(-2px);

    border-color: #35a853;

    background: #f0faf3;

    box-shadow:
        0 7px 18px rgba(25,135,84,0.15);
}


.role-button.selected {

    color: #ffffff;

    border-color: #d4af37;

    background:
        linear-gradient(
            135deg,
            #0b3d2e,
            #198754
        );

    box-shadow:
        0 8px 20px rgba(11,61,46,0.25);

    transform: translateY(-2px);
}


/* =========================================================
   SELECTED ROLE
========================================================= */

.selected-role {

    min-height: 22px;

    margin: 7px 0 17px;

    color: #198754;

    font-size: 13px;

    font-weight: 800;
}


/* =========================================================
   INPUTS
========================================================= */

.login-container input {

    width: 100%;

    height: 52px;

    padding: 0 15px;

    margin-bottom: 13px;

    border-radius: 11px;

    border: 1px solid #d8e1dc;

    background: #fbfdfc;

    color: #17231c;

    font-size: 15px;

    outline: none;

    transition:
        0.2s ease;
}


.login-container input::placeholder {

    color: #98a29d;
}


.login-container input:focus {

    border-color: #198754;

    background: #ffffff;

    box-shadow:
        0 0 0 3px rgba(25,135,84,0.12);
}


/* =========================================================
   PASSWORD
========================================================= */

.password-container {

    position: relative;

    width: 100%;
}


.password-container input {

    padding-right: 75px;
}


#togglePassword {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    width: auto;

    height: auto;

    margin: 0;

    padding: 7px 9px;

    border: none;

    border-radius: 7px;

    background: transparent;

    color: #198754;

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;
}


#togglePassword:hover {

    background: #eaf7ef;

    color: #0b3d2e;
}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

.forgot-password {

    text-align: right;

    margin-top: 0;

    margin-bottom: 18px;
}


.forgot-password a {

    color: #198754;

    font-size: 13px;

    font-weight: 700;

    text-decoration: none;
}


.forgot-password a:hover {

    color: #0b3d2e;

    text-decoration: underline;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {

    width: 100%;

    height: 55px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #0b3d2e,
            #198754 60%,
            #d4af37
        );

    color: #ffffff;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow:
        0 9px 22px rgba(11,61,46,0.25);

    transition:
        0.2s ease;
}


.login-button:hover {

    transform: translateY(-2px);

    filter: brightness(1.06);

    box-shadow:
        0 13px 27px rgba(11,61,46,0.32);
}


.login-button:active {

    transform: translateY(0);
}


/* =========================================================
   MESSAGE
========================================================= */

#message {

    min-height: 20px;

    margin: 13px 0 0;

    font-size: 13px;

    font-weight: 700;

    line-height: 1.4;

    color: #c62828;
}


/* =========================================================
   FOOTER
========================================================= */

.farm-footer {

    margin-top: 22px;

    padding-top: 15px;

    border-top: 1px solid #e4ebe7;

    text-align: center;

    font-size: 12px;

    color: #7b857f;
}


.farm-footer strong {

    color: #198754;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {

        padding: 12px;

    }

    .login-container {

        padding: 32px 18px 25px;

        border-radius: 21px;

    }

    .brand-icon {

        width: 58px;

        height: 58px;

        font-size: 26px;

    }

    .login-container h1 {

        font-size: 27px;

        letter-spacing: 1.5px;

    }

    .login-container h3 {

        font-size: 11px;

        letter-spacing: 1.5px;

    }

    .welcome {

        margin-top: 23px;

        font-size: 22px;

    }

    .login-instruction {

        font-size: 13px;

    }

    .roles-container {

        gap: 8px;

    }

    .role-button {

        min-height: 55px;

        padding: 9px 5px;

        font-size: 11.5px;

    }

    .login-container input {

        height: 50px;

        font-size: 14px;

    }

    .login-button {

        height: 52px;

    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .login-container {

        padding: 27px 14px 22px;

    }

    .login-container h1 {

        font-size: 24px;

    }

    .welcome {

        font-size: 20px;

    }

    .role-button {

        min-height: 52px;

        font-size: 10.5px;

    }

}

</style>

</head>


<body>

<div class="login-container">

    <!-- BRAND ICON -->
    <div class="brand-icon">
        🌿
    </div>

    <!-- BRAND -->
    <h1>MUNKA PIGGERY</h1>

    <h3>Farm Management System</h3>


    <!-- WELCOME -->
    <div class="welcome">
        Welcome Back
    </div>

    <p class="login-instruction">
        Sign in to manage your farm operations
    </p>


    <!-- ROLE -->
    <div class="role-title">
        Select Your Role
    </div>


    <div class="roles-container">

        <button
            type="button"
            class="role-button"
            data-role="owner/admin">
            Owner / Admin
        </button>

        <button
            type="button"
            class="role-button"
            data-role="farm manager">
            Farm Manager
        </button>

        <button
            type="button"
            class="role-button"
            data-role="serviceman">
            Serviceman<br>
            (Gestation Pen)
        </button>

        <button
            type="button"
            class="role-button"
            data-role="farrowman">
            Farrowman<br>
            (Farrowing Pen)
        </button>

        <button
            type="button"
            class="role-button"
            data-role="sales officer">
            Sales Officer
        </button>

        <button
            type="button"
            class="role-button"
            data-role="veterinary officer">
            Veterinary Officer
        </button>

        <button
            type="button"
            class="role-button"
            data-role="farm worker">
            Farm Worker
        </button>

    </div>


    <div
        id="selectedRole"
        class="selected-role">
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >


        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                id="togglePassword">
                Show
            </button>

        </div>


        <div class="forgot-password">

            <a href="forgot_password.html">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="login-button">
            🌿 LOGIN TO FARM
        </button>


        <p id="message"></p>

    </form>


    <!-- FOOTER -->

    <div class="farm-footer">

        <strong>MUNKA PIGGERY TECHNOLOGY</strong><br>

        Professional Farm Management &amp; Records System

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="activity.js"></script>

<script src="login.js"></script>


<!-- ROLE + PASSWORD UI -->

<script>

const roleButtons =
    document.querySelectorAll(".role-button");

const selectedRole =
    document.getElementById("selectedRole");

let selectedRoleValue = "";


/* ROLE SELECTION */

roleButtons.forEach(button => {

    button.addEventListener("click", () => {

        roleButtons.forEach(btn => {
            btn.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedRoleValue =
            button.dataset.role;

        selectedRole.textContent =
            "Selected role: " +
            button.textContent
                .replace(/\s+/g, " ")
                .trim();

    });

});


/* PASSWORD SHOW / HIDE */

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


togglePassword.addEventListener("click", () => {

    if (password.type === "password") {

        password.type = "text";

        togglePassword.textContent = "Hide";

    } else {

        password.type = "password";

        togglePassword.textContent = "Show";

    }

});


</script>

</body>

</html>
