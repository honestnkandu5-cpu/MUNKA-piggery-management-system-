<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MUNKA PIGGERY - Reset Password
    </title>

    <link
        rel="stylesheet"
        href="reset_password.css"
    >

</head>

<body>

    <div class="container">

        <h1>
            MUNKA PIGGERY
        </h1>

        <h2>
            Reset Password
        </h2>

        <p class="description">
            Enter a new password for your account.
        </p>


        <!-- =====================================
             RESET PASSWORD FORM
             ===================================== -->

        <form id="resetPasswordForm">


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <small>
                    Minimum 8 characters, including
                    uppercase, lowercase and a number.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- UPDATE BUTTON -->

            <button
                type="submit"
                id="resetButton"
            >
                Update Password
            </button>

        </form>


        <!-- =====================================
             MESSAGE
             ===================================== -->

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        >
        </div>


        <!-- =====================================
             BACK TO LOGIN
             ===================================== -->

        <div class="back">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>


    <!-- =====================================
         SUPABASE
         ===================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>

    <script src="reset_password.js"></script>

</body>

</html>
